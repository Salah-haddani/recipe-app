<div class="sticky top-0 z-5 flex justify-content-center mt-3">
  <div
    class="flex align-items-center justify-content-between w-full md:w-30rem px-4 py-2 bg-white border-round-3xl shadow-3 mt-3"
    style="border: 2px solid #ff7444"
  >
    <!-- Brand -->
    <a
      routerLink="/home"
      class="text-xl font-semibold text-orange-500 no-underline"
    >
      RecipeApp
    </a>

    <!-- Actions -->
    <div class="flex align-items-center gap-2">
      <p-button
        *ngIf="isPublisher()"
        label="My Kitchen"
        icon="pi pi-shop"
        severity="secondary"
        styleClass="border-round-3xl border-transparent text-gray-600"
        [style]="{
          background: 'linear-gradient(135deg, #fff5f0 0%, #ffe8dd 100%)'
        }"
        routerLink="/my-kitchen"
      ></p-button>

      <p-button
        label="Logout"
        icon="pi pi-sign-out"
        severity="danger"
        styleClass="border-round-3xl"
        (onClick)="logout()"
        outlined
      ></p-button>
    </div>
  </div>
</div>
<div
  class="text-center py-6 mt-5"
  style="background: linear-gradient(135deg, #fff5f0 0%, #ffe8dd 100%)"
>
  <h1
    class="text-4xl font-bold text-orange-500 flex align-items-center justify-content-center gap-2"
  >
    <i class="pi pi-shop text-3xl"></i>
    My Kitchen
  </h1>
  <p class="text-gray-600 mt-2">Create and manage your recipes</p>
</div>

<div class="w-11 md:w-10 lg:w-8 mx-auto py-6">
  <div class="grid">
    <div class="col-12">
      <app-recipe-list
        [title]="'My Recipe Collection'"
        [items]="myRecipes"
        [totalCount]="totalRecipes"
        [currentPage]="currentPage"
        [pageSize]="pageSize"
        [sortOrder]="currentSort"
        (onEdit)="editRecipe($event)"
        (onDelete)="deleteRecipe($event)"
        (onSortToggle)="toggleSort()"
        (onPageChange)="changePage($event)"
      >
      </app-recipe-list>
    </div>

    <div class="col-12 mt-5">
      <p-card
        [style]="{
          background: 'white'
        }"
      >
        <h2 class="text-2xl font-semibold mb-4 text-black-alpha-90">
          {{ isEditing ? "Edit Your Recipe" : "Create New Recipe" }}
        </h2>

        <form
          [formGroup]="recipeForm"
          (ngSubmit)="onSubmit()"
          class="flex flex-column gap-4"
        >
          <!-- Title -->
          <div class="flex flex-column gap-2">
            <label class="font-semibold text-sm text-black-alpha-90"
              >Recipe Title</label
            >
            <input
              pInputText
              formControlName="title"
              placeholder="e.g. Chocolate Cake"
              class="text-gray-600"
              [style]="{ background: 'white' }"
            />
          </div>

          <!-- Ingredients -->
          <div class="flex flex-column gap-2">
            <label class="font-semibold text-sm text-black-alpha-90"
              >Ingredients</label
            >
            <input
              pInputText
              formControlName="ingredients"
              placeholder="e.g. 1 cup sugar, 3 eggs"
              class="text-gray-600"
              [style]="{ background: 'white' }"
            />
            <small class="text-gray-500">
              Separate each ingredient with a comma
            </small>
          </div>

          <!-- Instructions -->
          <div class="flex flex-column gap-2">
            <label class="font-semibold text-sm text-black-alpha-90"
              >Instructions</label
            >
            <textarea
              pTextarea
              rows="5"
              formControlName="instructions"
              placeholder="Step by step instructions..."
              class="text-gray-600"
              [style]="{ background: 'white' }"
            ></textarea>
          </div>
          <!-- is Available -->
          <div class="flex align-items-center gap-2">
            <label class="font-semibold text-sm text-black-alpha-90"
              >Out Of Stock</label
            >
            <p-inputSwitch
              class="mt-2"
              formControlName="isAvailable"
            ></p-inputSwitch>
            <label class="font-semibold text-sm text-black-alpha-90"
              >Available</label
            >
          </div>
          <!-- Actions -->
          <div class="flex gap-2">
            <p-button
              type="submit"
              [label]="isEditing ? 'Update Recipe' : 'Publish Recipe'"
              [icon]="isEditing ? 'pi pi-check' : 'pi pi-plus'"
              [disabled]="recipeForm.invalid"
              styleClass="w-full"
              [style]="{ background: '#ff7444', border: 'none' }"
            ></p-button>

            <p-button
              *ngIf="isEditing"
              label="Cancel"
              icon="pi pi-times"
              styleClass="p-button-outlined"
              (onClick)="resetForm()"
            ></p-button>
          </div>
        </form>
      </p-card>
    </div>
  </div>
</div>
